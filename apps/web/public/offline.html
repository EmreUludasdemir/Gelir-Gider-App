<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çevrimdışı - Gelir-Gider Takip</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        padding: 20px;
      }
      .container {
        text-align: center;
        max-width: 400px;
      }
      .icon {
        font-size: 64px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 16px;
        color: #f9fafb;
      }
      p {
        color: #9ca3af;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .button {
        display: inline-block;
        background: #8b5cf6;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.2s;
      }
      .button:hover {
        background: #7c3aed;
      }
      .tips {
        margin-top: 40px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        text-align: left;
      }
      .tips h2 {
        font-size: 14px;
        color: #9ca3af;
        margin-bottom: 12px;
      }
      .tips ul {
        list-style: none;
      }
      .tips li {
        padding: 8px 0;
        color: #d1d5db;
        font-size: 14px;
      }
      .tips li::before {
        content: "✓ ";
        color: #10b981;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>Çevrimdışısınız</h1>
      <p>
        İnternet bağlantınız yok gibi görünüyor. Bağlantınızı kontrol edip
        tekrar deneyin.
      </p>
      <a
        href="/"
        class="button"
        onclick="window.location.reload(); return false;"
        >Tekrar Dene</a
      >

      <div class="tips">
        <h2>Çevrimdışı İpuçları:</h2>
        <ul>
          <li>Son verileriniz önbelleğe alındı</li>
          <li>Bağlantı geldiğinde işlemler senkronize edilecek</li>
          <li>WiFi veya mobil veri bağlantınızı kontrol edin</li>
        </ul>
      </div>
    </div>

    <script>
      // Check connection and reload when online
      window.addEventListener("online", () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
