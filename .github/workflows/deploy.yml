name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log deployment start
        run: |
          echo "🚀 Starting deployment to ${{ github.event.inputs.environment }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Production deployment steps
      - name: Deploy to Production
        if: github.event.inputs.environment == 'production'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 15
            docker-compose -f docker-compose.prod.yml ps

      # Staging deployment steps
      - name: Deploy to Staging
        if: github.event.inputs.environment == 'staging'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /app
            docker-compose pull
            docker-compose up -d --remove-orphans
            sleep 10

      - name: Health Check
        run: |
          echo "🏥 Running health checks..."
          if [ "${{ github.event.inputs.environment }}" == "production" ]; then
            curl -f ${{ secrets.PROD_URL }}/health || exit 1
          else
            curl -f ${{ secrets.STAGING_URL }}/health || exit 1
          fi
          echo "✅ Health check passed!"

      - name: Notify deployment complete
        run: |
          echo "✅ Deployment to ${{ github.event.inputs.environment }} completed successfully!"
          echo "Deployed at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      # Discord notification
      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Deployment - ${{ github.event.inputs.environment }}"
          description: |
            **Environment:** ${{ github.event.inputs.environment }}
            **Commit:** ${{ github.sha }}
            **Actor:** ${{ github.actor }}
          color: ${{ job.status == 'success' && '0x00ff00' || '0xff0000' }}
