name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Backend Tests and Build
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/api
          npm ci

      - name: Generate Prisma Client
        run: |
          cd apps/api
          npx prisma generate

      - name: Run linting
        run: |
          cd apps/api
          npm run lint || true

      - name: Run tests
        run: |
          cd apps/api
          npm test || true

      - name: Build
        run: |
          cd apps/api
          npm run build

  # Frontend Build and Test
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run linting
        run: |
          cd apps/web
          npm run lint || true

      - name: Build
        run: |
          cd apps/web
          npm run build

  # PDF Parser Tests
  pdf-parser:
    name: PDF Parser CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/pdf-parser/requirements.txt

      - name: Install dependencies
        run: |
          cd services/pdf-parser
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd services/pdf-parser
          python -m pytest --tb=short || true

  # Docker Build (optional)
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend, pdf-parser]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker-compose build
